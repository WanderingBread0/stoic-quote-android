name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools platform-tools" tries to install the
          # legacy standalone "tools" package, which Google has removed from
          # the SDK repository — that now fails hard instead of just warning.
          # Only platform-tools is actually needed; AGP/Gradle fetch the
          # build-tools and platform (API 34) themselves.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stoic-quote-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Update "latest" Release with new APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug build
          body: |
            Debug APK built from commit ${{ github.sha }}.

            On your phone:
            1. Tap the APK below to download.
            2. Open the downloaded file (Android may ask permission to install from this source).
            3. After install, long-press your home screen → Widgets → find "Stoic Quote" → drag to home screen.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
